<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 774 100" width="774" height="100" role="img" aria-label="GTA VIRAL">
  <title>GTA VIRAL</title>

  <style>
    /*
     * TINTA CLARA FIXA — e o motivo é uma armadilha que quase passou.
     *
     * A primeira versão trocava de cor por `prefers-color-scheme`, o que é o
     * certo para um arquivo que não sabe onde vai ser exibido. Só que esta
     * aplicação é escura POR IDENTIDADE, não por preferência: a raiz do
     * documento leva a classe `dark` fixa (ver layout.tsx). Quem tivesse o
     * sistema em modo
     * claro receberia o letreiro em #17101f sobre um fundo #0a0712 — logo
     * preto sobre fundo preto, invisível, e sem nenhum erro no console para
     * denunciar.
     *
     * O SVG não enxerga a classe do documento quando carregado como imagem, e
     * `currentColor` também não chega ali. Então a cor é fixa e combina com o
     * único fundo que existe. Se um dia a aplicação ganhar tema claro, este
     * arquivo precisa virar componente inline para herdar a cor.
     *
     * Nada de sinal de menor que dentro deste comentário: SVG solto é parseado
     * como XML, e o conteúdo de `style` NÃO é CDATA implícito como no HTML —
     * um `img` entre colchetes angulares aqui derruba o arquivo inteiro.
     */
    .gv-tinta { stroke: #f5f1f7; }

    .gv-q1 { stop-color: #ff3d9a; }
    .gv-q2 { stop-color: #f95d1e; }
    .gv-q3 { stop-color: #ffc247; }
  </style>

  <defs>
    <!-- O sol: ouro no topo, magenta na água. -->
    <linearGradient id="gv-sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="0.45" stop-color="#ff7333"/>
      <stop offset="1" stop-color="#ec1d80"/>
    </linearGradient>

    <!-- Mesmo sol, deitado: atravessa o "VI" da esquerda para a direita. -->
    <linearGradient id="gv-marquise" gradientUnits="userSpaceOnUse" x1="286" y1="0" x2="384" y2="0">
      <stop offset="0" class="gv-q1"/>
      <stop offset="0.55" class="gv-q2"/>
      <stop offset="1" class="gv-q3"/>
    </linearGradient>

    <!-- Vazado: o play e as três lâminas do sol viram buraco, não cor.
         Assim o símbolo assenta em qualquer fundo. -->
    <mask id="gv-vazado">
      <path d="M22 2H78L98 22V78L78 98H22L2 78V22Z" fill="#fff"/>
      <path d="M38 28L76 50L38 72Z" fill="#000"/>
      <rect x="0" y="76" width="100" height="4" fill="#000"/>
      <rect x="0" y="84" width="100" height="5" fill="#000"/>
      <rect x="0" y="91" width="100" height="5" fill="#000"/>
    </mask>
  </defs>

  <!-- Símbolo: sol chanfrado descendo atrás do horizonte, com o play vazado. -->
  <path d="M22 2H78L98 22V78L78 98H22L2 78V22Z" fill="url(#gv-sol)" mask="url(#gv-vazado)"/>

  <!-- Letreiro. Traço único, cantos chanfrados: tubo de néon montado no grid. -->
  <g transform="translate(144,0)" fill="none" stroke-width="15" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
    <!-- G T A -->
    <g class="gv-tinta">
      <path d="M54 24L38 8L24 8L8 24L8 76L24 92L38 92L54 76L54 54L34 54"/>
      <path d="M82 8L144 8M113 8L113 92"/>
      <path d="M172 92L178 8L212 8L218 92M174.4 58L215.6 58"/>
    </g>

    <!-- VI — o trocadilho mora aqui, e é a única coisa acesa no letreiro. -->
    <g stroke="url(#gv-marquise)">
      <path d="M294 8L317 92L340 8"/>
      <path d="M376 8L376 92"/>
    </g>

    <!-- R A L -->
    <g class="gv-tinta">
      <path d="M412 92L412 8L442 8L458 24L458 34L442 50L412 50M438 50L458 92"/>
      <path d="M494 92L500 8L534 8L540 92M496.4 58L537.6 58"/>
      <path d="M576 8L576 76L592 92L622 92"/>
    </g>
  </g>
</svg>
